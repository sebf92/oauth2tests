<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SPIFFE Service{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f4f6fb; }
    .navbar-brand { font-weight: 700; letter-spacing: -.3px; }
    .code-box {
      font-family: 'Courier New', monospace;
      font-size: .78rem;
      background: #1e1e2e;
      color: #cdd6f4;
      padding: 1rem 1.25rem;
      border-radius: .5rem;
      overflow-x: auto;
      word-break: break-all;
    }
    .jwt-header    { color: #fb015b; }
    .jwt-payload   { color: #d63aff; }
    .jwt-signature { color: #00b9f1; }
    .claim-key   { color: #d63aff; }
    .claim-value { color: #00b9f1; }
    .step-card { transition: box-shadow .18s; }
    .step-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.1); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="/ui">
      <i class="bi bi-fingerprint text-info me-2"></i>SPIFFE Service
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% block nav_home %}{% endblock %}" href="/ui">
            <i class="bi bi-house me-1"></i>Home
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% block nav_demo %}{% endblock %}" href="/ui/demo">
            <i class="bi bi-play-circle me-1"></i>Run Demo
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/jwks" target="_blank">
            <i class="bi bi-key me-1"></i>JWKS
            <i class="bi bi-box-arrow-up-right ms-1" style="font-size:.65rem"></i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/docs" target="_blank">
            <i class="bi bi-book me-1"></i>API Docs
            <i class="bi bi-box-arrow-up-right ms-1" style="font-size:.65rem"></i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="http://localhost:5000" target="_blank">
            <i class="bi bi-shield-lock-fill text-info me-1"></i>OAuth2 Demo App
            <i class="bi bi-box-arrow-up-right ms-1" style="font-size:.65rem"></i>
          </a>
        </li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        <span class="badge bg-info text-dark">
          <i class="bi bi-fingerprint me-1"></i>spiffe://{{ trust_domain }}/spiffe-service
        </span>
      </div>
    </div>
  </div>
</nav>

<div class="container py-4">
  {% block content %}{% endblock %}
</div>

<footer class="py-3 mt-4 border-top bg-white text-center text-muted small">
  SPIFFE Service Demo &bull; RFC 7523 private_key_jwt &bull; Keycloak 26.4+ &bull; SPIRE 1.10
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
