# UC2-Hardened mTLS proxy — nginx config.
#
# Terminates mTLS on :8443 using a SPIRE-issued server cert.
# Validates client certs against the SPIRE trust-domain bundle.
# Forwards verified requests to Keycloak's plain-HTTP :8080.
# Limits the proxied surface to the Keycloak token + OIDC endpoints — anything
# else returns 404 so the mTLS path can't be used as an open proxy.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Docker embedded DNS — needed if we ever want dynamic upstream resolution.
    resolver 127.0.0.11 ipv6=off valid=30s;

    log_format mtls '[$time_local] $remote_addr "$request" $status '
                    'tls_verify="$ssl_client_verify" '
                    'client_dn="$ssl_client_s_dn"';
    access_log /var/log/nginx/access.log mtls;

    server {
        listen 8443 ssl;
        server_name keycloak-mtls-proxy localhost;

        # Server cert + key — SPIRE-issued X.509-SVID for the proxy itself.
        # Written by /entrypoint.sh after a Workload API fetch at startup.
        ssl_certificate     /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;

        # Client cert validation against the SPIRE trust-domain bundle.
        # Any cert signed by SPIRE's CA in trust-domain demo.local passes here;
        # the SPIFFE-ID-level check is enforced by Keycloak on the cert subject DN
        # via clientAuthenticatorType=client-x509 (see keycloak-init/setup.py).
        ssl_client_certificate /etc/nginx/tls/spire-bundle.crt;
        ssl_verify_client      on;
        ssl_verify_depth       3;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers   HIGH:!aNULL:!MD5;

        # Restrict to Keycloak's auth endpoints (defense in depth — the mTLS
        # path is not a general-purpose Keycloak proxy).
        location ~ ^/realms/[^/]+/(\.well-known/|protocol/openid-connect/(token|certs)) {
            # Belt-and-braces: refuse if nginx didn't successfully verify the cert.
            # `ssl_verify_client on` already returns 400 on failure but this
            # protects against config drift turning verification optional.
            if ($ssl_client_verify != "SUCCESS") {
                return 401 '{"error":"client_certificate_required"}';
            }

            proxy_pass http://keycloak:8080;

            # Keep Host = the published Keycloak hostname so issuer/audience
            # claims stay consistent with the rest of the demo.  Critically,
            # we do NOT set X-Forwarded-Proto=https here: with KC_PROXY_HEADERS
            # Keycloak would derive the `iss` claim from that header and emit
            # tokens with iss="https://localhost:8080/realms/demo", which the
            # other demo services (resource-server, mcp-service) — configured
            # with KEYCLOAK_ISSUER=http://... — would reject.  Letting Keycloak
            # default to its KC_HOSTNAME (http://localhost:8080) keeps every
            # flow's iss claim identical regardless of which entry path was used.
            proxy_set_header Host                localhost:8080;
            proxy_set_header X-Forwarded-For     $remote_addr;

            # The keycloak x509cert-lookup=nginx provider reads the client cert
            # from this header.  $ssl_client_escaped_cert is URL-encoded PEM
            # (newlines as %0A) — the format the provider expects.
            proxy_set_header ssl-client-cert     $ssl_client_escaped_cert;
            proxy_set_header ssl-client-verify   $ssl_client_verify;
            proxy_set_header ssl-client-subject-dn $ssl_client_s_dn;
        }

        # Anything else → 404.  Surfacing "this proxy is for token endpoints only"
        # is more useful than a generic 502.
        location / {
            return 404 '{"error":"endpoint_not_exposed_via_mtls_proxy","hint":"only Keycloak token + OIDC endpoints are proxied"}';
        }
    }
}
