agent {
  data_dir           = "/tmp/spire-agent-data"
  log_level          = "INFO"
  server_address     = "spire-server"
  server_port        = "8081"
  socket_path        = "/tmp/spire-agent/public/api.sock"
  trust_domain       = "demo.local"
  # insecure_bootstrap skips the initial bundle verification — acceptable for a dev demo.
  # In production, supply a bootstrap trust bundle via trust_bundle_path.
  insecure_bootstrap = true
}

plugins {
  NodeAttestor "join_token" {
    plugin_data {}
  }

  KeyManager "memory" {
    plugin_data {}
  }

  # unix workload attestor: selects workloads by OS-level UID/GID/process info.
  # Simpler than the docker attestor (no /var/run/docker.sock required) and
  # sufficient for a single-service demo environment.
  WorkloadAttestor "unix" {
    plugin_data {}
  }
}
